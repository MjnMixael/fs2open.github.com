name: Build Test package

on:
  push:
    branches:
      - 'test/*'

jobs:
  build_linux:
    strategy:
      matrix:
        configuration: [FastDebug, Release]
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    name: Linux
    runs-on: ${{ matrix.os }}
    container: ghcr.io/scp-fs2open/linux_build:sha-ab87451
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          submodules: true
      - name: Set workspace as safe
        # This appears to be broken in current actions, so do it manually
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up test version
        shell: bash
        run: |
          [[ "${{ github.ref }}" =~ ^refs\/heads\/test\/(.*)$ ]]
          # Override the revision string so that the builds are named correctly
          echo "set(FSO_VERSION_REVISION_STR ${BASH_REMATCH[1]})" > "version_override.cmake"
      - name: Configure CMake
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          COMPILER: gcc-9
        run: $GITHUB_WORKSPACE/ci/linux/configure_cmake.sh
      - name: Compile
        working-directory: ./build
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: ninja -k 20 all
      - name: Run Tests
        working-directory: ./build
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          XDG_RUNTIME_DIR: /root
        run: $GITHUB_WORKSPACE/ci/linux/run_tests.sh
      - name: Generate AppImage
        working-directory: ./build
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: $GITHUB_WORKSPACE/ci/linux/generate_appimage.sh $GITHUB_WORKSPACE/build/install
      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.configuration }}-${{ matrix.arch }}
          path: ${{ github.workspace }}/build/install/*.AppImage
  linux_zip:
    name: Build Linux distribution zip
    needs: build_linux
    runs-on: ubuntu-latest
    container: ghcr.io/scp-fs2open/sftp_upload:sha-ab87451
    strategy:
      fail-fast: false  # Package the other builds even if one fails
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          submodules: true
          fetch-depth: '0'
          ref: '${{ github.ref }}'
      - name: Set workspace as safe
        # This appears to be broken in current actions, so do it manually
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Release builds
        uses: actions/download-artifact@v8
        with:
          name: linux-Release-${{ matrix.arch }}
          path: builds
      - name: Download FastDebug builds
        uses: actions/download-artifact@v8
        with:
          name: linux-FastDebug-${{ matrix.arch }}
          path: builds
      - name: Fix permissions
        working-directory: ./builds
        shell: bash
        run: chmod 755 *.AppImage
      - name: Create Distribution package
        id: generate_package
        working-directory: ./builds
        env:
          ARCH: ${{ matrix.arch }}
        run: $GITHUB_WORKSPACE/ci/linux/create_dist_pack.sh Linux
      - name: Upload result package
        # Attached to the run rather than sent to SCP's file servers, which OFP has no access to
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.generate_package.outputs.package_name }}
          path: ${{ steps.generate_package.outputs.package_path }}

  build_windows:
    strategy:
      matrix:
        configuration: [FastDebug, Release]
        os: [windows-2022, windows-11-arm]
        arch: [Win32, x64, ARM64]
        simd: [SSE2, ""]
        exclude:
          - arch: Win32
            os: windows-11-arm
          - arch: x64
            os: windows-11-arm
          - arch: ARM64
            os: windows-2022
          - os: windows-2022
            simd: ""
          - os: windows-11-arm
            simd: SSE2
    name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          submodules: true
      - name: Set workspace as safe
        # This appears to be broken in current actions, so do it manually
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up test version
        shell: bash
        run: |
          [[ "${{ github.ref }}" =~ ^refs\/heads\/test\/(.*)$ ]]
          # Override the revision string so that the builds are named correctly
          echo "set(FSO_VERSION_REVISION_STR ${BASH_REMATCH[1]})" > "version_override.cmake"
      - name: Configure CMake
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          ARCHITECTURE: ${{ matrix.arch }}
          SIMD: ${{ matrix.simd }}
        shell: bash
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_INSTALL_PREFIX="$(pwd)/install" -DFSO_USE_SPEECH=ON \
            -DFSO_USE_VOICEREC=ON -DFORCED_SIMD_INSTRUCTIONS="$SIMD" \
            -DFSO_BUILD_TESTS=ON -DFSO_INSTALL_DEBUG_FILES=ON -A "$ARCHITECTURE" \
            -DQT_USE_PRECOMPILED=ON ${{ matrix.os == 'windows-11-arm' && '-G "Visual Studio 18 2026"' || '-G "Visual Studio 17 2022" -T "v143"' }} \
            -DCMAKE_BUILD_TYPE=$CONFIGURATION ..
      - name: Compile
        working-directory: ./build
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          COMPILER: ${{ matrix.compiler }}
        shell: bash
        run: |
          cmake --build . --config "$CONFIGURATION" --target INSTALL -- /verbosity:minimal
          ls -alR "$(pwd)/install"
      - name: Run Tests
        working-directory: ./build
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        shell: bash
        run: ./bin/$CONFIGURATION/unittests --gtest_shuffle
      - name: Set artifact id
        shell: bash
        run: |
          id=
          if [ -n "${{ matrix.simd }}" ]; then
            id="${{ matrix.configuration }}-${{ matrix.arch }}-${{ matrix.simd }}"
          else
            id="${{ matrix.configuration }}-${{ matrix.arch }}"
          fi
          echo "artifact_id=${id}" >> $GITHUB_ENV
      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ env.artifact_id }}
          path: ${{ github.workspace }}/build/install/*
  windows_zip:
    name: Build Windows distribution zip
    needs: build_windows
    runs-on: ubuntu-latest
    container: ghcr.io/scp-fs2open/sftp_upload:sha-ab87451
    strategy:
      fail-fast: false  # Package the other builds even if one fails
      matrix:
        arch: [Win32, x64, ARM64]
        simd: [SSE2, ""]
        exclude:
          - arch: Win32
            simd: ""
          - arch: x64
            simd: ""
          - arch: ARM64
            simd: SSE2
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          submodules: true
          fetch-depth: '0'
          ref: '${{ github.ref }}'
      - name: Set workspace as safe
        # This appears to be broken in current actions, so do it manually
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set artifact id
        shell: bash
        run: |
          id=
          if [ -n "${{ matrix.simd }}" ]; then
            id="${{ matrix.arch }}-${{ matrix.simd }}"
          else
            id="${{ matrix.arch }}"
          fi
          echo "artifact_id=${id}" >> $GITHUB_ENV
      - name: Download Release builds
        uses: actions/download-artifact@v8
        with:
          name: windows-Release-${{ env.artifact_id }}
          path: builds
      - name: Download FastDebug builds
        uses: actions/download-artifact@v8
        with:
          name: windows-FastDebug-${{ env.artifact_id }}
          path: builds
      - name: Create Distribution package
        id: generate_package
        working-directory: ./builds
        shell: bash
        env:
          ID: ${{ env.artifact_id }}
        run: $GITHUB_WORKSPACE/ci/linux/create_dist_pack.sh Windows
      - name: Upload result package
        # Attached to the run rather than sent to SCP's file servers, which OFP has no access to
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.generate_package.outputs.package_name }}
          path: ${{ steps.generate_package.outputs.package_path }}
      - name: Upload debug package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.generate_package.outputs.debug_name }}
          path: ${{ steps.generate_package.outputs.debug_path }}

  build_mac:
    strategy:
      matrix:
        configuration: [FastDebug, Release]
        compiler: [clang]
        arch: [x86_64, arm64]
    name: Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          submodules: true
          fetch-depth: 0
      - name: Set workspace as safe
        # This appears to be broken in current actions, so do it manually
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up test version
        shell: bash
        run: |
          [[ "${{ github.ref }}" =~ ^refs\/heads\/test\/(.*)$ ]]
          # Override the revision string so that the builds are named correctly
          echo "set(FSO_VERSION_REVISION_STR ${BASH_REMATCH[1]})" > "version_override.cmake"
      - name: Configure CMake
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          COMPILER: ${{ matrix.compiler }}
          ARCHITECTURE: ${{ matrix.arch }}
        run: $GITHUB_WORKSPACE/ci/linux/configure_cmake.sh
      - name: Compile
        working-directory: ./build
        run: ninja all
      - name: Run Tests
        working-directory: ./build
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          ARCH: ${{ matrix.arch }}
          XDG_RUNTIME_DIR: /root
        run: $GITHUB_WORKSPACE/ci/linux/run_tests.sh
      - name: Sign builds
        working-directory: ./build/bin
        run: |
          # make sure OpenAL framework is signed
          find . -name OpenAL -type f | while read xx; do codesign --force -s - $xx; done
          find . -name OpenAL.framework -type d | while read xx; do codesign --force -s - $xx; done
          # make sure dylibs are signed
          find . -name \*.dylib -type f | while read xx; do codesign --force -s - $xx; done
          # sign binaries
          find . -perm +111 -type f | grep MacOS | while read xx; do codesign --force -s - $xx; done
          # sign apps
          find . -name \*.app -maxdepth 1 | while read xx; do codesign --force -s - $xx; done
      - name: Package build result
        working-directory: ./build/bin
        # Use GNU tar here (part of runner image) to avoid weird corruption bug with bsdtar
        # Ref: https://github.com/actions/runner-images/issues/2619
        run: gtar -cvzf macos-build-${{ matrix.configuration }}-${{ matrix.arch }}.tgz *.app
      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.configuration }}-${{ matrix.arch }}
          path: ${{ github.workspace }}/build/bin/macos-build-${{ matrix.configuration }}-${{ matrix.arch }}.tgz
  mac_zip:
    name: Build Mac distribution zip
    needs: build_mac
    runs-on: ubuntu-latest
    container: ghcr.io/scp-fs2open/sftp_upload:sha-ab87451
    strategy:
      fail-fast: false  # Package the other builds even if one fails
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          submodules: true
          fetch-depth: '0'
          ref: '${{ github.ref }}'
      - name: Set workspace as safe
        # This appears to be broken in current actions, so do it manually
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Release builds
        uses: actions/download-artifact@v8
        with:
          name: mac-Release-${{ matrix.arch }}
          path: builds
      - name: Download FastDebug builds
        uses: actions/download-artifact@v8
        with:
          name: mac-FastDebug-${{ matrix.arch }}
          path: builds
      - name: Unpack builds
        working-directory: ./builds
        run: |
          tar -xvzf macos-build-Release-${{ matrix.arch }}.tgz
          tar -xvzf macos-build-FastDebug-${{ matrix.arch }}.tgz
      - name: Create Distribution package
        id: generate_package
        working-directory: ./builds
        env:
          ARCH: ${{ matrix.arch }}
        run: $GITHUB_WORKSPACE/ci/linux/create_dist_pack.sh Mac
      - name: Upload result package
        # Attached to the run rather than sent to SCP's file servers, which OFP has no access to
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.generate_package.outputs.package_name }}
          path: ${{ steps.generate_package.outputs.package_path }}

  publish_release:
    # Workflow artifacts need a GitHub login to download, so the packages also go up as a pre-release
    # that anyone can reach: one per test branch, replaced on every push. Its tag does not start with
    # release_, so nothing in the release pipeline picks it up.
    name: Publish test build
    needs: [linux_zip, windows_zip, mac_zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release and its tag
    concurrency:
      group: test-release-${{ github.ref }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: test_*
          path: dist
          merge-multiple: true
      - name: Replace the test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          name="${BRANCH#test/}"
          name="${name//\//-}"
          tag="test-${name}"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/* \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Test build: ${name}" \
            --notes "Test build of branch ${BRANCH} at ${GITHUB_SHA}. Not a release. Built by ${RUN_URL}"
