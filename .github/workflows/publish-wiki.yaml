name: Publish wiki

# wiki/ is the source of the GitHub wiki. Every push to master that changes it
# replaces the wiki's pages with wiki/, so edits made on the wiki itself are lost.
on:
  push:
    branches:
      - master
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          sparse-checkout: wiki

      - uses: actions/checkout@v7
        name: Checkout the wiki
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo

      - name: Copy wiki/ over the wiki's pages
        run: |
          find wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r wiki/. wiki-repo/

      - name: Commit and push
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "Publish wiki from ${GITHUB_SHA::9}"
          git push
